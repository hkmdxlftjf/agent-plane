name: Images

# Build and publish the container images to the GitHub Container Registry
# (ghcr.io). Uses the built-in GITHUB_TOKEN (packages: write) — no PAT needed.
# Images land at ghcr.io/<owner>/{agent-plane,agent-plane-registry,
# agent-plane-runtime,agent-plane-example-mcp,agent-plane-coding-agent,
# agent-plane-lark-mcp}.
#
# Adding an image is one matrix entry plus its Dockerfile; everything below is
# shared.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: build & push (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: agent-plane
            dockerfile: Dockerfile
          - image: agent-plane-registry
            dockerfile: Dockerfile.registry
          - image: agent-plane-runtime
            dockerfile: Dockerfile.agent-runtime
          - image: agent-plane-example-mcp
            dockerfile: Dockerfile.example-mcp
          # opencode plus the Agent Plane plugin: the runtime for Agents with
          # spec.workspace. It replaces the separate Lark adapter image, which
          # is no longer built — the platform connection now lives inside this
          # one (see docs/usage.md §14).
          - image: agent-plane-coding-agent
            dockerfile: Dockerfile.coding-agent
          # The official Feishu MCP server, packaged for the MCPServer CRD. Built
          # here because config/samples/coding/lark-mcp.yaml names an image, and a
          # sample that names an image only ever built on one laptop is a sample
          # nobody else can run.
          - image: agent-plane-lark-mcp
            dockerfile: Dockerfile.lark-mcp
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
