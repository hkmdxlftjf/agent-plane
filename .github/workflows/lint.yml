name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve the linter version from the Makefile
        id: lint-version
        # Single source of truth: the Makefile pin. Reading it here keeps a local
        # `make lint` and this job on the same checks.
        run: |
          version="$(make --no-print-directory print-golangci-lint-version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "golangci-lint ${version}"

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ steps.lint-version.outputs.version }}
