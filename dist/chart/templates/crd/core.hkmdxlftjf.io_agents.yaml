{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.19.0
  name: agents.core.hkmdxlftjf.io
spec:
  group: core.hkmdxlftjf.io
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - ag
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.modelRef.name
      name: Model
      type: string
    - jsonPath: .status.resolvedConfigHash
      name: Hash
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Agent is the Schema for the agents API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Agent
            properties:
              agentClassRef:
                description: |-
                  agentClassRef optionally references an AgentClass providing shared
                  defaults (base workflow, default policies) that this Agent inherits.
                properties:
                  name:
                    description: name is the metadata.name of the referenced resource.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              description:
                description: description is a human-readable summary of the agent's
                  purpose.
                type: string
              knowledgeBaseRefs:
                description: knowledgeBaseRefs lists KnowledgeBases the agent may
                  retrieve from (RAG).
                items:
                  description: |-
                    LocalReference points at another Agent Plane resource by name, in the same
                    namespace as the referring object. This is the primary composition primitive:
                    an Agent references a Model, Tools, a Workflow, etc. via LocalReference.
                  properties:
                    name:
                      description: name is the metadata.name of the referenced resource.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              memoryRefs:
                description: memoryRefs lists Memory backends available to the agent.
                items:
                  description: |-
                    LocalReference points at another Agent Plane resource by name, in the same
                    namespace as the referring object. This is the primary composition primitive:
                    an Agent references a Model, Tools, a Workflow, etc. via LocalReference.
                  properties:
                    name:
                      description: name is the metadata.name of the referenced resource.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              modelRef:
                description: |-
                  modelRef references the Model this agent uses. Optional at the API level so
                  it may be inherited from an AgentClass's defaultModelRef; an Agent with no
                  effective model (neither here nor via its class) is marked Degraded.
                properties:
                  name:
                    description: name is the metadata.name of the referenced resource.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              policyRefs:
                description: policyRefs lists Policies constraining the agent (model/memory/tool
                  access).
                items:
                  description: |-
                    LocalReference points at another Agent Plane resource by name, in the same
                    namespace as the referring object. This is the primary composition primitive:
                    an Agent references a Model, Tools, a Workflow, etc. via LocalReference.
                  properties:
                    name:
                      description: name is the metadata.name of the referenced resource.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              promptRef:
                description: promptRef references the PromptTemplate providing system/role
                  prompts.
                properties:
                  name:
                    description: name is the metadata.name of the referenced resource.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              runtime:
                description: |-
                  runtime, when set, tells the Operator to materialize an in-cluster agent
                  runtime Deployment for this Agent (pull model: the container reads its
                  config from the Registry). Omit to keep Agent Plane purely declarative and
                  bring your own runtime.
                properties:
                  env:
                    description: |-
                      env is extra environment passed to the runtime container. The Operator
                      always injects AGENTPLANE_REGISTRY, AGENTPLANE_AGENT_NAMESPACE, AGENTPLANE_AGENT_NAME.
                    items:
                      description: EnvVar represents an environment variable present
                        in a Container.
                      properties:
                        name:
                          description: |-
                            Name of the environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        value:
                          description: |-
                            Variable references $(VAR_NAME) are expanded
                            using the previously defined environment variables in the container and
                            any service environment variables. If a variable cannot be resolved,
                            the reference in the input string will be unchanged. Double $$ are reduced
                            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                            Escaped references will never be expanded, regardless of whether the variable
                            exists or not.
                            Defaults to "".
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: The key to select.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: |-
                                Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: |-
                                FileKeyRef selects a key of the env file.
                                Requires the EnvFiles feature gate to be enabled.
                              properties:
                                key:
                                  description: |-
                                    The key within the env file. An invalid key will prevent the pod from starting.
                                    The keys defined within a source may consist of any printable ASCII characters except '='.
                                    During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                  type: string
                                optional:
                                  default: false
                                  description: |-
                                    Specify whether the file or its key must be defined. If the file or key
                                    does not exist, then the env var is not published.
                                    If optional is set to true and the specified key does not exist,
                                    the environment variable will not be set in the Pod's containers.

                                    If optional is set to false and the specified key does not exist,
                                    an error will be returned during Pod creation.
                                  type: boolean
                                path:
                                  description: |-
                                    The path within the volume from which to select the file.
                                    Must be relative and may not contain the '..' path or start with '..'.
                                  type: string
                                volumeName:
                                  description: The name of the volume mount containing
                                    the env file.
                                  type: string
                              required:
                              - key
                              - path
                              - volumeName
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              description: |-
                                Selects a resource of the container: only resources limits and requests
                                (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                              properties:
                                containerName:
                                  description: 'Container name: required for volumes,
                                    optional for env vars'
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Specifies the output format of the
                                    exposed resources, defaults to "1"
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  description: 'Required: resource to select'
                                  type: string
                              required:
                              - resource
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              description: Selects a key of a secret in the pod's
                                namespace
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  image:
                    description: image is the agent runtime container image to run.
                    minLength: 1
                    type: string
                  port:
                    description: port, if set, exposes the runtime via a Service on
                      this port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  replicas:
                    default: 1
                    description: replicas is the desired number of runtime pods.
                    format: int32
                    minimum: 0
                    type: integer
                  resources:
                    description: resources is the runtime container resource requirements.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                required:
                - image
                type: object
              skillRefs:
                description: skillRefs lists Skills (markdown instruction packs) the
                  agent loads.
                items:
                  description: |-
                    LocalReference points at another Agent Plane resource by name, in the same
                    namespace as the referring object. This is the primary composition primitive:
                    an Agent references a Model, Tools, a Workflow, etc. via LocalReference.
                  properties:
                    name:
                      description: name is the metadata.name of the referenced resource.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              toolRefs:
                description: toolRefs lists individual Tools the agent may invoke.
                items:
                  description: |-
                    LocalReference points at another Agent Plane resource by name, in the same
                    namespace as the referring object. This is the primary composition primitive:
                    an Agent references a Model, Tools, a Workflow, etc. via LocalReference.
                  properties:
                    name:
                      description: name is the metadata.name of the referenced resource.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              toolSetRefs:
                description: toolSetRefs lists ToolSets (named bundles of Tools) the
                  agent inherits.
                items:
                  description: |-
                    LocalReference points at another Agent Plane resource by name, in the same
                    namespace as the referring object. This is the primary composition primitive:
                    an Agent references a Model, Tools, a Workflow, etc. via LocalReference.
                  properties:
                    name:
                      description: name is the metadata.name of the referenced resource.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              workflowRef:
                description: |-
                  workflowRef references the Workflow describing the agent's execution
                  shape (e.g. planner/tool/reflect/finish). Optional when inherited from an
                  AgentClass or supplied by the runtime's default.
                properties:
                  name:
                    description: name is the metadata.name of the referenced resource.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            type: object
          status:
            description: status defines the observed state of Agent
            properties:
              conditions:
                description: conditions represent the current state of the Agent resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              phase:
                description: phase is a coarse summary of reconcile state.
                enum:
                - Pending
                - Ready
                - Degraded
                type: string
              resolvedConfigHash:
                description: |-
                  resolvedConfigHash is a stable hash of the fully resolved runtime
                  configuration (model + workflow + tools + prompt + memory + policies).
                  Runtimes and the Registry use it to detect when config must be refreshed.
                type: string
              resolvedRefs:
                description: resolvedRefs is the number of references that resolved
                  successfully.
                type: integer
              runtimeAvailableReplicas:
                description: |-
                  runtimeAvailableReplicas mirrors the managed runtime Deployment's
                  available replicas (only when spec.runtime is set).
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end -}}
