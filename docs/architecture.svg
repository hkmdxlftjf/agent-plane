<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 0 896 700" width="896" height="700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Agent Plane architecture</title>
  <desc>The control plane (kube-apiserver with CRDs, admission webhooks, Operator, Registry) declares and reconciles desired state. The data plane (Agent Runtime, MCP and Tool servers) pulls fully-resolved config from the Registry over HTTP and SSE and never calls the API server. Inbound events arrive from IM platforms through a Trigger adapter that the Operator owns.</desc>

  <defs>
    <marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a5b0c0"/>
    </marker>
  </defs>

  <rect x="-16" width="896" height="700" fill="#ffffff"/>

  <text x="40" y="44" font-size="21" font-weight="700" fill="#0f172a">Agent Plane</text>
  <text x="40" y="66" font-size="12.5" fill="#64748b">A Kubernetes control plane for AI agents — it declares and reconciles; runtimes read config from the Registry.</text>

  <!-- ================= CONTROL PLANE ================= -->
  <rect x="40" y="92" width="452" height="330" rx="12" fill="#f8fafc" stroke="#dde3ea" stroke-width="1.5"/>
  <text x="60" y="118" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="1.3">CONTROL PLANE</text>

  <!-- apiserver -->
  <rect x="60" y="132" width="412" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="153" font-size="14" font-weight="700" fill="#0f172a">kube-apiserver</text>
  <text x="76" y="171" font-size="11.5" fill="#64748b">CRDs — Agent, Model, Tool, Skill, …</text>
  <!-- webhook tag, inside the apiserver row: validation happens on the write path -->
  <rect x="300" y="144" width="158" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="379" y="162" text-anchor="middle" font-size="11" fill="#475569">admission webhooks</text>

  <!-- apiserver <-> operator -->
  <path d="M150,184 L150,224" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <text x="162" y="208" font-size="11" fill="#475569">watch</text>
  <path d="M232,224 L232,184" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <text x="244" y="208" font-size="11" fill="#475569">status</text>

  <!-- operator -->
  <rect x="60" y="224" width="412" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="248" font-size="14" font-weight="700" fill="#0f172a">Operator</text>
  <text x="76" y="266" font-size="11.5" fill="#64748b">15 controllers — resolve refs, enforce Policy, materialize workloads</text>
  <text x="76" y="282" font-size="11" fill="#94a3b8">internal/controller/</text>

  <!-- operator -> registry -->
  <path d="M150,290 L150,330" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <text x="162" y="314" font-size="11" fill="#475569">resolvedConfigHash</text>

  <!-- registry -->
  <rect x="60" y="330" width="412" height="66" rx="9" fill="#ffffff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="76" y="354" font-size="14" font-weight="700" fill="#0f172a">Registry</text>
  <text x="76" y="372" font-size="11.5" fill="#64748b">the single config source for runtimes — GET /config, GET /watch (SSE)</text>
  <text x="76" y="388" font-size="11" fill="#94a3b8">cmd/registry/</text>

  <!-- ================= DATA PLANE ================= -->
  <rect x="556" y="92" width="284" height="330" rx="12" fill="#f8fafc" stroke="#dde3ea" stroke-width="1.5"/>
  <text x="576" y="118" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="1.3">DATA PLANE</text>

  <!-- agent runtime -->
  <rect x="576" y="132" width="244" height="80" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="592" y="156" font-size="14" font-weight="700" fill="#0f172a">Agent Runtime</text>
  <text x="592" y="174" font-size="11.5" fill="#64748b">bring your own framework —</text>
  <text x="592" y="190" font-size="11.5" fill="#64748b">LangGraph, Agents SDK, Claude Code…</text>
  <text x="592" y="206" font-size="11" fill="#94a3b8">hot-reloads on config change</text>

  <!-- runtime -> tools -->
  <path d="M660,212 L660,264" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <text x="672" y="243" font-size="11" fill="#475569">MCP JSON-RPC / HTTP</text>

  <!-- mcp / tools -->
  <rect x="576" y="264" width="244" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="592" y="288" font-size="14" font-weight="700" fill="#0f172a">MCP &amp; Tool servers</text>
  <text x="592" y="306" font-size="11.5" fill="#64748b">Deployment + Service,</text>
  <text x="592" y="322" font-size="11.5" fill="#64748b">owned by the Operator</text>

  <!-- ============ THE HEADLINE EDGE: registry -> runtime ============ -->
  <!-- straight, unobstructed, in the gap between the two planes -->
  <path d="M492,363 L524,363 L524,172 L576,172" fill="none" stroke="#4f46e5" stroke-width="2.6" marker-end="url(#a-indigo)"/>
  <!-- label rides the arrow's vertical run, in the empty gutter between the panels -->
  <text transform="rotate(-90 512 300)" x="512" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#4f46e5">resolved config · HTTP + SSE</text>

  <!-- the negative claim, stated where the missing arrow would be -->
  <text x="504" y="410" font-size="10.5" font-style="italic" fill="#a5b0c0">runtimes never call the API server</text>

  <!-- ================= INBOUND ================= -->
  <rect x="40" y="452" width="800" height="112" rx="12" fill="#f8fafc" stroke="#dde3ea" stroke-width="1.5"/>
  <text x="60" y="478" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="1.3">INBOUND EVENTS — Trigger</text>

  <rect x="60" y="492" width="200" height="56" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="514" font-size="13.5" font-weight="700" fill="#0f172a">IM platform</text>
  <text x="76" y="532" font-size="11.5" fill="#64748b">Lark · Slack · DingTalk · webhook</text>

  <path d="M260,520 L336,520" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#a-teal)"/>
  <text x="298" y="512" text-anchor="middle" font-size="11" fill="#0d9488">event</text>

  <rect x="336" y="492" width="208" height="56" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="352" y="514" font-size="13.5" font-weight="700" fill="#0f172a">Trigger adapter</text>
  <text x="352" y="532" font-size="11.5" fill="#64748b">your image, owned Deployment</text>

  <path d="M544,520 L620,520" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#a-teal)"/>
  <text x="582" y="512" text-anchor="middle" font-size="11" fill="#0d9488">POST</text>

  <rect x="620" y="492" width="200" height="56" rx="9" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="636" y="514" font-size="13" font-weight="700" fill="#0f172a">/api/chat</text>
  <text x="636" y="532" font-size="11.5" fill="#64748b">on the Agent Runtime above</text>

  <!-- operator owns the adapter: short hop down from the operator box -->
  <!-- routed outside the control-plane panel so it crosses nothing -->
  <path d="M60,257 L26,257 L26,520 L60,520" fill="none" stroke="#a5b0c0" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a-gray)"/>
  <text x="22" y="430" text-anchor="middle" font-size="10" font-style="italic" fill="#a5b0c0">owns</text>

  <!-- ================= LEGEND ================= -->
  <line x1="40" y1="606" x2="72" y2="606" stroke="#475569" stroke-width="1.8" marker-end="url(#a-dark)"/>
  <text x="82" y="610" font-size="11.5" fill="#64748b">reconcile loop</text>

  <line x1="196" y1="606" x2="228" y2="606" stroke="#4f46e5" stroke-width="2.4" marker-end="url(#a-indigo)"/>
  <text x="238" y="610" font-size="11.5" fill="#64748b">config out to runtimes</text>

  <line x1="396" y1="606" x2="428" y2="606" stroke="#0d9488" stroke-width="1.8" marker-end="url(#a-teal)"/>
  <text x="438" y="610" font-size="11.5" fill="#64748b">events in</text>

  <line x1="536" y1="606" x2="568" y2="606" stroke="#a5b0c0" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a-gray)"/>
  <text x="578" y="610" font-size="11.5" fill="#64748b">Operator-owned workload</text>

  <text x="40" y="650" font-size="11.5" fill="#94a3b8">Agent Plane is not an agent runtime: no inference, planning, or tool-calling. It declares resources, reconciles</text>
  <text x="40" y="668" font-size="11.5" fill="#94a3b8">desired state, and serves aggregated config — any agent framework plugs in behind the same contract.</text>
</svg>
