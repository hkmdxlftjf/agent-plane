apiVersion: core.hkmdxlftjf.io/v1alpha1
kind: MCPServer
metadata:
  name: orders-mcp
spec:
  image: ghcr.io/agent-plane/example-orders-mcp:latest
  transport: http
  port: 8080
  replicas: 1
  env:
    - name: LOG_LEVEL
      value: info
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
