metadata: {name: travel-plan-viz-engine, namespace: travel-demo}
spec:
  description: >-
    travel-plan-viz 的生成引擎：trip 数据契约、页面必含区块、须原样内联的 map.js/reminders.js 引擎源码、GCJ-02 坐标转换片段与交付自检清单。
