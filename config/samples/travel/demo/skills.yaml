apiVersion: v1
data:
  skill.md: |
    # 旅行计划可视化

    用户想要旅行计划、行程页、攻略网页时加载本 skill。产出方式已从"自己写 HTML"改为
    "调用 render_trip 工具"——数据校验与页面渲染由工具机械完成，你只负责研究与组织
    trip 数据。

    ## 数据来源

    1. **高德 MCP 工具（真实数据）**：amap-poi-search（按关键词+城市查 POI，得名称/地址/坐标）、
       amap-around-search（按坐标查周边）、amap-weather（城市天气预报）。排行程前逐城调用，
       把真实名称/坐标写进 trip。
    2. 工具给不了的（营业时间/门票参考价/评分/一句话点评/航班候选/酒店价位），用你的知识填，
       保持参考价口径（"约 ¥xx"）。
    3. 若给图片 URL，先用 check-urls 批量验证，换掉死链或干脆省略 photo 字段（可选字段，渲染
       器会优雅降级，不会露破图）。

    **坐标系**：高德返回 GCJ-02。把坐标原样写入 trip 并设 `coordinateSystem: "GCJ-02"`——
    render-trip 会自动纠偏为 WGS-84，你不需要也不能自己转换。

    ## trip 数据结构

    ```
    trip = {
      title, startDate("YYYY-MM-DD"), coordinateSystem: "GCJ-02"|"WGS-84",
      preTrip: { weather:{summary,typhoon}, packing, payment, apps[], ticketTip },
      flights: { booked:[{label,code,time}], candidates:[{label,code,time,note}] },
      hotelAreas: [ { area, reason, options:[{tier,name,priceRange,note}] } ],
      disclaimer,  // 必填，>=20 字，全覆盖免责声明
      tips: [],
      reminders: [ {item, leadDays} ],  // 喂给页顶待办清单
      days: [ { date, weekday, theme?, tips?[], alternatives?[{label,summary}],
        slots: [ { period:"morning"|"noon"|"evening", name, time, lat, lng,
          photo?, rating?, review?, openingHours?, closedDays?, ticketPrice?,
          transport?{mode,fare,duration}, seasonal?, needsBooking, leadDays } ],
        dining: [ {meal, place, hours, dishes:[{name,price}]} ] } ]
    }
    ```

    ## 交付流程

    1. 组好 trip JSON。
    2. 调用 **render-trip**（`trip`，可选 `design: {colorScheme, accentColor, fontFamily, customCSS}`
       让每趟配色不同）。
    3. 如果返回校验失败（`isError`，errors 列表），按报错修 trip 重新调用——**不要**自己拼 HTML
       兜底，工具的校验就是为了不让不完整数据流出去。
    4. 成功后拿到 `{artifactId, summary, warnings}`。回复给用户：2–3 句总结 + 亮点，**最后一行
       写 `[artifact:<artifactId>]`**（聊天界面据此渲染可预览/下载的行程页卡片）。不要在回复里
       粘贴任何 HTML。
    5. warnings 非空时口头提一句（如"缺酒店信息，已用通用建议占位"），不阻塞交付。

    ## 边界

    不做实时票价查询、代订票；免责声明与"官方渠道核实"提醒由渲染器固定生成，不需要你重复写。
