apiVersion: core.hkmdxlftjf.io/v1alpha1
kind: Workflow
metadata:
  name: react-loop
spec:
  engine: langgraph
  version: "1.0.0"
  steps:
    - name: plan
      type: planner
      next: ["act"]
    - name: act
      type: tool
      next: ["reflect"]
    - name: reflect
      type: reflect
      next: ["act", "finish"]
    - name: finish
      type: finish
