# Inbound event source: bringing IM messages into an Agent.
#
# Agent Plane implements no platform protocol. It schedules the adapter image you
# supply and injects a fixed contract (docs/adapter-protocol.md); the adapter
# owns the Lark/DingTalk/Slack connection and the reply call. Adding a platform
# means a new adapter image and another Trigger — no control-plane change.
#
# The Lark adapter is built from this repo (Dockerfile.lark-adapter) and is the
# reference implementation of the contract. It holds a WebSocket out to Lark, so
# no ingress, TLS certificate, or public webhook URL is needed — only egress.
#
# Prerequisites: the shared Model/Credential samples, and a Secret holding the
# platform app credentials. In the Lark console the app needs the
# im:message:send_as_bot permission and an im.message.receive_v1 event
# subscription set to "long connection" mode.
#
#   kubectl create secret generic lark-app \
#     --from-literal=app-id=cli_xxx --from-literal=app-secret=yyy
#   kubectl apply -f config/samples/inbound/lark-trigger.yaml -n <ns>
#   kubectl get trigger lark-support
#
# Watch what the adapter was told to call:
#
#   kubectl get trigger lark-support -o jsonpath='{.status.agentEndpoint}'
apiVersion: core.hkmdxlftjf.io/v1alpha1
kind: Credential
metadata:
  name: lark-app
spec:
  # The whole Secret is mounted into the adapter, so every key is available as a
  # file under $AGENTPLANE_CREDENTIAL_PATH. This key is the one other consumers
  # (and status reporting) treat as the primary.
  secretRef:
    name: lark-app
    key: app-secret
---
apiVersion: core.hkmdxlftjf.io/v1alpha1
kind: Agent
metadata:
  name: support-agent
spec:
  description: Support agent reachable from an IM platform.
  modelRef:
    name: llm-model
  # An inbound adapter POSTs to the Agent's runtime, so the Agent must expose
  # one. port is what makes the Operator create the Service; without it the
  # Trigger goes Degraded rather than pointing the adapter at nothing.
  runtime:
    image: ghcr.io/hkmdxlftjf/agent-plane-runtime:latest
    port: 8080
    env:
      # The image defaults to --watch; this switches it to serve mode, which is
      # what exposes POST /api/chat.
      - name: AGENTPLANE_SERVE
        value: "1"
---
apiVersion: core.hkmdxlftjf.io/v1alpha1
kind: Trigger
metadata:
  name: lark-support
spec:
  agentRef:
    name: support-agent
  image: ghcr.io/hkmdxlftjf/agent-plane-lark-adapter:latest
  credentialRef:
    name: lark-app
  # Passed through verbatim as AGENTPLANE_TRIGGER_CONFIG. The control plane does
  # not interpret it — the shape is whatever your adapter reads. These two keys
  # are what this adapter looks for; both are optional.
  config:
    # Open a thread on each answered message. Off by default — in a one-on-one
    # chat it turns the conversation into collapsed branches — but worth it in a
    # busy group chat, where an answer can otherwise drift from its question.
    replyInThread: false
    # An agent that reads code or searches thinks for a while; too short a
    # timeout shows the user silence mid-answer.
    timeoutSeconds: 300
  env:
    - name: LOG_LEVEL
      value: info
  # replicas is capped at 1: most platforms deliver each event to every open
  # connection, so a second replica answers every message twice.
