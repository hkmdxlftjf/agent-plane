# A complete, self-contained CogNet Agent demo (namespace: cognet-demo).
#
# The Model + Secret are environment-specific (they hold an API key and endpoint)
# and are created by hack/demo.sh, not committed here. Everything else — the MCP
# server, the Tool that fronts it, a markdown Skill, the prompt, and the Agent
# that ties them together — is declared below.
#
# Run it with:  bash hack/demo.sh
namespace: cognet-demo

resources:
- credential.yaml
- mcpserver.yaml
- tool.yaml
- skill.yaml
- prompttemplate.yaml
- agent.yaml
