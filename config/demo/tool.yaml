apiVersion: core.hkmdxlftjf.io/v1alpha1
kind: Tool
metadata:
  name: order-lookup
spec:
  type: mcp
  description: Look up the delivery status of a customer order by its order id.
  mcpServerRef:
    name: orders-mcp
  mcpToolName: get_order_status
  timeoutSeconds: 15
  inputSchema:
    type: object
    properties:
      orderId:
        type: string
        description: the order id to look up
    required: ["orderId"]
