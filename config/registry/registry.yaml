# In-cluster Registry (data-plane config endpoint). Read-only access to Agent Plane
# resources; deliberately NO access to Secrets (runtimes read Secrets themselves).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-plane-registry
  namespace: agent-plane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-plane-registry
rules:
- apiGroups: ["core.hkmdxlftjf.io"]
  resources:
  - agents
  - models
  - tools
  - toolsets
  - skills
  - mcpservers
  - credentials
  - prompttemplates
  - memories
  - policies
  - agentclasses
  - knowledgebases
  - workflows
  verbs: ["get", "list", "watch"]
# ConfigMaps only — Skill instruction content may live in a ConfigMap. Still NO
# access to Secrets: runtimes read Secret values (model keys, memory DSNs) themselves.
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-plane-registry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-plane-registry
subjects:
- kind: ServiceAccount
  name: agent-plane-registry
  namespace: agent-plane-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-plane-registry
  namespace: agent-plane-system
  labels: {app.kubernetes.io/name: agent-plane-registry}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: agent-plane-registry}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agent-plane-registry}
    spec:
      serviceAccountName: agent-plane-registry
      containers:
      - name: registry
        image: agent-plane-registry:dev
        args: ["--addr", ":9090"]
        ports:
        - {name: http, containerPort: 9090}
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-plane-registry
  namespace: agent-plane-system
  labels: {app.kubernetes.io/name: agent-plane-registry}
spec:
  selector: {app.kubernetes.io/name: agent-plane-registry}
  ports:
  - {name: http, port: 9090, targetPort: 9090}
